name: Gource visualization

permissions:
  contents: read
  actions: read

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # weekly
  push:
    branches: [ main, master ]

jobs:
  gource:
    name: Generate Gource video
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Gource video
        uses: nbprojekt/gource-action@v1.3.0
        with:
          gource-video-length: 60
          gource-title: 'Legend Ledger development timeline'
          hide-mouse: true
          hide-date: true
          hide-filenames: true
          auto-rotate: true
          camera-mode: overview

      - name: Re-encode with ffmpeg
        run: |
          ffmpeg -i gource.mp4 -c:v libx264 -preset slow -crf 18 \
            -pix_fmt yuv420p -vf "scale=1920:1080" \
            -c:a aac -b:a 192k -movflags +faststart \
            legend-ledger_gource_1080p.mp4

      - name: Upload Gource video
        uses: actions/upload-artifact@v4
        with:
          name: gource-video
          path: legend-ledger_gource_1080p.mp4
          retention-days: 90

      - name: Upload video to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: legend-ledger_gource_1080p.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
